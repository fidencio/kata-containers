name: Kata Containers CI (trusted)

# The trusted lane of the CI. It is triggered by ci-on-push.yaml - the untrusted
# pull_request lane - and picks up where that one has to stop: it holds the
# repository secrets, so it can publish the images the untrusted lane could only
# build into a docker archive, and run the suites that need a registry, AKS or a
# self-hosted runner.
#
# Two properties are what make that safe, and both have to keep holding for
# every job added here:
#
#   - The workflow code is always the default branch's. GitHub resolves
#     workflow_run workflows from the default branch, so a pull request cannot
#     change what this lane does.
#   - The test harness is the base branch's too. Every suite checks out
#     `inputs.commit-hash`, so passing github.sha - the default branch tip, on a
#     workflow_run - runs base-branch tests/ against the pull request's
#     artifacts. Nothing here checks out the fork, which is also why no
#     actions/checkout in this lane needs allow-unsafe-pr-checkout.
#
# The cost of the second property is that changes to tests/ are not exercised
# here; Gatekeeper requires the ok-to-test-prt lane for those instead. See
# tools/testing/gatekeeper/required-tests.yaml.
#
# Because a workflow_run run is attributed to the default branch rather than to
# the pull request, none of this shows up on the PR of its own accord. The lane
# therefore posts a commit status on the pull request's head commit pointing at
# its own run, and Gatekeeper follows that pointer to collect the results (see
# tools/testing/gatekeeper/jobs.py).

on:
  # zizmor: ignore[dangerous-triggers]
  # Privileged by design. It is safe for the two reasons above: the workflow
  # code comes from the default branch, and no job checks out the pull request.
  workflow_run:
    workflows:
      - Kata Containers CI (GitHub-hosted runners)
    types:
      - requested

permissions: {}

concurrency:
  # The head SHA changes with every push, so grouping on it would leave
  # superseded runs alive. The fork's branch is what stays constant for the life
  # of the pull request.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  resolve:
    name: resolve
    # ci-on-push.yaml only runs on pull_request, but a run of it from any other
    # event would carry none of the pull request context this lane needs.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read # needed to find the pull request behind the run
      statuses: write # needed to point the pull request at this run
    outputs:
      stale: ${{ steps.pr.outputs.stale }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
      tag: ${{ steps.pr.outputs.tag }}
      tarball-suffix: ${{ steps.pr.outputs.tarball-suffix }}
      target-branch: ${{ steps.pr.outputs.target-branch }}
    steps:
      - name: Resolve the pull request behind the untrusted run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -o errexit -o nounset -o pipefail

          # workflow_run hands us the commit but not the pull request: the
          # event's pull_requests list is always empty when the run came from a
          # fork. The branch it came from is what identifies the pull request
          # instead, and the run names both the fork and the branch.
          #
          # Asking which pull request a commit heads would be the obvious way
          # and does not work: that endpoint only associates commits the
          # repository itself holds, and a fork's are not among them, so it
          # answers with nothing for exactly the pull requests this lane is for.
          #
          # The commit is still checked against the answer, so that a branch
          # rewritten while this run was queued leaves the run superseded rather
          # than aimed at a different commit than the one that was built.
          pr="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${HEAD_REPO%%/*}:${HEAD_BRANCH}" \
            --jq '[.[] | select(.head.sha == env.HEAD_SHA)][0] // empty')"

          if [[ -z "${pr}" ]]; then
            echo "::notice::No open pull request has ${HEAD_BRANCH} of ${HEAD_REPO} at ${HEAD_SHA}, so it was most likely superseded. Nothing to test."
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          number="$(jq -r '.number' <<< "${pr}")"
          base="$(jq -r '.base.ref' <<< "${pr}")"

          # Every artifact of the untrusted run is named after this pair, so
          # both lanes arrive at the same names without passing any along.
          {
            echo "stale=false"
            echo "pr-number=${number}"
            echo "tag=${number}-${HEAD_SHA}"
            echo "tarball-suffix=-${number}-${HEAD_SHA}"
            echo "target-branch=${base}"
          } >> "${GITHUB_OUTPUT}"

      - name: Point the pull request at this run
        if: ${{ steps.pr.outputs.stale == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o errexit -o nounset -o pipefail

          # This status is the only thing tying the lane to the pull request:
          # Gatekeeper reads it to learn which run to collect results from. It
          # matches the context literally, so the two have to be kept in step.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state=pending \
            --field context='Trusted CI lane' \
            --field target_url="${RUN_URL}" \
            --field description='Collecting the results of the trusted lane'

  # The lane is triggered when the untrusted run starts, not when it finishes,
  # so that the wait below is only for the artifacts it needs rather than for
  # every test the untrusted lane runs. Waiting for the whole run would put the
  # untrusted lane's slowest suite in front of everything here.
  wait-for-artifacts:
    name: wait-for-artifacts
    needs: [resolve]
    if: ${{ needs.resolve.outputs.stale == 'false' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read # needed to read the untrusted run and its artifacts
    # Long enough to cover a cold amd64 build, and short enough to report a
    # stuck untrusted lane rather than sit out the six hour default.
    timeout-minutes: 180
    steps:
      - name: Wait for the untrusted run to upload what this lane consumes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # Keyed on the artifacts rather than on the job names, because the
          # artifacts are the actual dependency, and their names are all this
          # lane knows the untrusted jobs by.
          EXPECTED: |
            kata-deploy-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
            kata-monitor-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
            kata-tools-static-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
        run: |
          set -o errexit -o nounset -o pipefail

          deadline=$((SECONDS + 170 * 60))

          while :; do
            uploaded="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[].name')"

            missing=()
            while read -r want; do
              [[ -n "${want}" ]] || continue
              grep -qxF "${want}" <<< "${uploaded}" || missing+=("${want}")
            done <<< "${EXPECTED}"

            if [[ "${#missing[@]}" -eq 0 ]]; then
              echo "All expected artifacts are uploaded."
              break
            fi

            # The untrusted run reaching a terminal state without them means
            # they are never coming: a build failed, or the run was cancelled.
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')"
            if [[ "${status}" == "completed" ]]; then
              echo "::error::The untrusted run finished without uploading: ${missing[*]}"
              exit 1
            fi

            if [[ "${SECONDS}" -ge "${deadline}" ]]; then
              echo "::error::Gave up waiting for: ${missing[*]}"
              exit 1
            fi

            echo "Still waiting for ${#missing[@]} artifact(s): ${missing[*]}"
            sleep 60
          done

  # This is the whole point of the lane: the images exist, but only as docker
  # archives, because the lane that built them holds no credentials to push
  # them anywhere. Publishing them here is what puts them within reach of a
  # cluster that is not the runner itself, an AKS one above all.
  publish-images:
    name: publish-images
    needs: [resolve, wait-for-artifacts]
    if: ${{ needs.resolve.outputs.stale == 'false' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read # needed to fetch the untrusted run's artifacts
      packages: write # needed to push the images to ghcr.io
    env:
      ARCHIVE_DIR: /tmp/kata-image-tarballs
    steps:
      - name: get-kata-deploy-image-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-deploy-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          path: ${{ env.ARCHIVE_DIR }}
          # Another run's artifacts, so this needs a token and the run to take
          # them from; without both, the action looks inside this run instead.
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: get-kata-monitor-image-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-monitor-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          path: ${{ env.ARCHIVE_DIR }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Kata Containers ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the images built by the untrusted lane
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.resolve.outputs.tag }}-amd64
        run: |
          set -o errexit -o nounset -o pipefail

          # ghcr.io accepts lowercase repository paths only.
          owner="${REGISTRY_OWNER,,}"

          publish() {
            local archive="${1}"
            local repo="${2}"

            # The untrusted lane tags for localhost, a registry that cannot
            # serve the image, so that a side-load it failed to do surfaces as a
            # pull failure there instead of quietly passing. Here the tag has to
            # become one that does resolve.
            docker load --input "${ARCHIVE_DIR}/${archive}"
            docker tag "localhost/${repo}:${IMAGE_TAG}" "ghcr.io/${owner}/${repo}:${IMAGE_TAG}"
            docker push "ghcr.io/${owner}/${repo}:${IMAGE_TAG}"

            # Reclaim the space as we go: the runner would otherwise have to
            # hold every archive plus every image loaded out of them at once.
            rm -f "${ARCHIVE_DIR}/${archive}"
          }

          # kata-deploy runs the installation, and in job mode hands it to the
          # dispatcher, so both are needed. The dispatcher's repository name is
          # derived the way the build script and the helm chart derive it, with
          # the "-ci" suffix kept last.
          publish kata-deploy.tar kata-deploy-ci
          publish kata-deploy-job-dispatcher.tar kata-deploy-job-dispatcher-ci

          # Not needed by the suites here yet. It is published all the same, so
          # that the kata-monitor suites can move over without the images
          # arriving from two different lanes.
          publish kata-monitor.tar kata-monitor-ci

  # The suites fetch their artifacts by name from the run they are part of, and
  # the ones they want were uploaded to the untrusted run. Copying them over is
  # what lets every suite workflow stay exactly as it is: teaching each of them
  # to fetch from another run instead would mean an input, a token and a step in
  # all of them, for the benefit of this lane alone.
  #
  # Only small artifacts belong here. The image archives are big, and nothing
  # downstream reads them from an artifact anyway - publish-images turns them
  # into something the clusters can pull.
  restage-artifacts:
    name: restage-artifacts
    needs: [resolve, wait-for-artifacts]
    if: ${{ needs.resolve.outputs.stale == 'false' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read # needed to fetch the untrusted run's artifacts
    steps:
      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          path: restaged
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: store-artifact kata-tools-static-tarball-amd64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          # Named file rather than the directory, so the artifact keeps the shape
          # the build gave it and a suite finds what it expects at the top.
          path: restaged/kata-tools-static.tar.zst
          # Nothing outside this run reads it, and the build's own copy is the
          # one worth keeping around.
          retention-days: 1
          # Already-compressed tarball; deflating it again costs time and saves
          # close to nothing.
          compression-level: 0
          # The build having changed the layout under us should stop the lane
          # here, not surface as a puzzling failure inside a suite.
          if-no-files-found: error

  # The first suite to move. Its cluster is in Azure, so it cannot side-load an
  # image the way the untrusted lane's suites do, and provisioning it needs
  # credentials the untrusted lane will never hold.
  run-k8s-tests-on-aks:
    needs: [resolve, publish-images, restage-artifacts]
    if: ${{ needs.resolve.outputs.stale == 'false' }}
    permissions:
      contents: read
      id-token: write # needed for OIDC access to log into Azure
    uses: ./.github/workflows/run-k8s-tests-on-aks.yaml
    with:
      tarball-suffix: ${{ needs.resolve.outputs.tarball-suffix }}
      registry: ghcr.io
      repo: ${{ github.repository_owner }}/kata-deploy-ci
      tag: ${{ needs.resolve.outputs.tag }}-amd64
      # The base branch, not the pull request. The suite checks this out, so it
      # is what keeps the harness a reviewed one; the artifacts it exercises are
      # still the pull request's. On a workflow_run, github.sha is the tip of the
      # default branch.
      commit-hash: ${{ github.sha }}
      pr-number: ${{ needs.resolve.outputs.pr-number }}
      target-branch: ${{ needs.resolve.outputs.target-branch }}
    secrets:
      AZ_APPID: ${{ secrets.AZ_APPID }}
      AZ_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}
      AZ_SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}

  report:
    name: report
    needs: [resolve, wait-for-artifacts, publish-images, restage-artifacts, run-k8s-tests-on-aks]
    # always(), so that a failing suite still resolves the pending status the
    # resolve job left on the pull request.
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.stale == 'false' }}
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
    steps:
      - name: Report the lane's outcome on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -o errexit -o nounset -o pipefail

          # Only for the humans reading the pull request: Gatekeeper judges this
          # lane by the jobs of this run, not by the state of this status.
          state=success
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) state=failure ;;
            esac
          done

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state="${state}" \
            --field context='Trusted CI lane' \
            --field target_url="${RUN_URL}" \
            --field description="The trusted lane finished with: ${RESULTS}"
