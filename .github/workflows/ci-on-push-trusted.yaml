name: Kata Containers CI (trusted)

# The trusted lane of the CI. It is triggered by ci-on-push.yaml - the untrusted
# pull_request lane - and picks up where that one has to stop: it holds the
# repository secrets, so it can publish the images the untrusted lane could only
# build into a docker archive, and run the suites that need a registry, AKS or a
# self-hosted runner.
#
# Two properties are what make that safe, and both have to keep holding for
# every job added here:
#
#   - The workflow code is always the default branch's. GitHub resolves
#     workflow_run workflows from the default branch, so a pull request can
#     change what this lane is handed, but never what it does with it.
#   - Nothing is built here. The artifacts arrive from the untrusted lane, which
#     is where the build scripts run - by far the largest body of code a pull
#     request brings, and now none of it runs anywhere near a secret.
#
# What this lane does run is the pull request's own tests/, checked out at the
# very commit the artifacts were built from, so that a pull request changing a
# test and the code under it is exercised as one tree. That is what
# allow-unsafe-pr-checkout on the suites' checkout is for, and it is a
# deliberate exception rather than an oversight: ok-to-test is a maintainer
# saying the diff has been read, which is exactly what the label has always
# meant on the pull_request_target lane this replaces. The difference is that
# the build no longer runs privileged, and only the suites that genuinely need a
# cluster do.
#
# So the lane only runs on a pull request labelled ok-to-test, and leaves its
# status pending until then. Adding the label later does not start it - nothing
# re-fires workflow_run - which is what /retest is for.
#
# The one thing that cannot be exercised from here is this lane's own workflow
# files, since those are always the default branch's. Keep the YAML in this lane
# thin and put the substance in tests/, which does come from the pull request.
#
# Because a workflow_run run is attributed to the default branch rather than to
# the pull request, none of this shows up on the PR of its own accord. The lane
# therefore posts a commit status on the pull request's head commit pointing at
# its own run, and Gatekeeper follows that pointer to collect the results (see
# tools/testing/gatekeeper/jobs.py).

on:
  # zizmor: ignore[dangerous-triggers]
  # Privileged by design. The workflow code comes from the default branch, no
  # job here builds anything, and the fork code it does run is the tests/ of a
  # pull request a maintainer has labelled - see the note above.
  workflow_run:
    workflows:
      - Kata Containers CI (GitHub-hosted runners)
    types:
      - requested

permissions: {}

concurrency:
  # The head SHA changes with every push, so grouping on it would leave
  # superseded runs alive. The fork's branch is what stays constant for the life
  # of the pull request.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  resolve:
    name: resolve
    # ci-on-push.yaml only runs on pull_request, but a run of it from any other
    # event would carry none of the pull request context this lane needs.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read # needed to find the pull request behind the run
      statuses: write # needed to point the pull request at this run
    outputs:
      # found: there is a pull request at this commit, so there is something to
      # post a status on. proceed: it is also cleared to run.
      found: ${{ steps.pr.outputs.found }}
      proceed: ${{ steps.pr.outputs.proceed }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
      tag: ${{ steps.pr.outputs.tag }}
      tarball-suffix: ${{ steps.pr.outputs.tarball-suffix }}
      target-branch: ${{ steps.pr.outputs.target-branch }}
    steps:
      - name: Resolve the pull request behind the untrusted run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # Keep in step with the set that lists this lane's checks in
          # tools/testing/gatekeeper/required-tests.yaml: the label that lets
          # the lane run has to be the label Gatekeeper requires it for.
          REQUIRED_LABEL: ok-to-test
        run: |
          set -o errexit -o nounset -o pipefail

          # workflow_run hands us the commit but not the pull request: the
          # event's pull_requests list is always empty when the run came from a
          # fork. The branch it came from is what identifies the pull request
          # instead, and the run names both the fork and the branch.
          #
          # Asking which pull request a commit heads would be the obvious way
          # and does not work: that endpoint only associates commits the
          # repository itself holds, and a fork's are not among them, so it
          # answers with nothing for exactly the pull requests this lane is for.
          #
          # The commit is still checked against the answer, so that a branch
          # rewritten while this run was queued leaves the run superseded rather
          # than aimed at a different commit than the one that was built.
          pr="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${HEAD_REPO%%/*}:${HEAD_BRANCH}" \
            --jq '[.[] | select(.head.sha == env.HEAD_SHA)][0] // empty')"

          if [[ -z "${pr}" ]]; then
            echo "::notice::No open pull request has ${HEAD_BRANCH} of ${HEAD_REPO} at ${HEAD_SHA}, so it was most likely superseded. Nothing to test."
            {
              echo "found=false"
              echo "proceed=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          number="$(jq -r '.number' <<< "${pr}")"
          base="$(jq -r '.base.ref' <<< "${pr}")"

          # This label is the lane's security boundary, not a courtesy. Past
          # this point a pull request's tests/ are checked out and run with this
          # repository's secrets, on clusters it pays for, and binaries a fork
          # built are published under its name. ok-to-test is a maintainer
          # saying the diff has been read - the same thing it means on the
          # pull_request_target lane today.
          #
          # A label survives new pushes, which is what makes it usable at all
          # and is also its weak spot: what was read is not necessarily what
          # ends up running. A branch rewritten under the label loses it - see
          # .github/workflows/revoke-ok-to-test.yaml - and the authorise job
          # below reads the label again once the artifacts are in, so that this
          # early answer is never the one acted on.
          #
          # Gatekeeper reads this same label to decide whether to require these
          # checks at all, so the two cannot drift apart.
          #
          # The status below is posted either way, so that the lane can be
          # pointed at once the label arrives - see .github/workflows/retest.yaml.
          if jq -e --arg want "${REQUIRED_LABEL}" \
              'any(.labels[]?.name; . == $want)' <<< "${pr}" > /dev/null; then
            proceed=true
          else
            echo "::notice::Pull request ${number} is not labelled ${REQUIRED_LABEL}, so the trusted lane will not run. A maintainer can label it and comment /retest."
            proceed=false
          fi

          # Every artifact of the untrusted run is named after this pair, so
          # both lanes arrive at the same names without passing any along.
          {
            echo "found=true"
            echo "proceed=${proceed}"
            echo "pr-number=${number}"
            echo "tag=${number}-${HEAD_SHA}"
            echo "tarball-suffix=-${number}-${HEAD_SHA}"
            echo "target-branch=${base}"
          } >> "${GITHUB_OUTPUT}"

      - name: Point the pull request at this run
        if: ${{ steps.pr.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DESCRIPTION: ${{ steps.pr.outputs.proceed == 'true' && 'Collecting the results of the trusted lane' || 'Waiting for a maintainer to add the ok-to-test label' }}
        run: |
          set -o errexit -o nounset -o pipefail

          # This status is the only thing tying the lane to the pull request:
          # Gatekeeper reads it to learn which run to collect results from, and
          # /retest reads it to learn which run to start over. It matches the
          # context literally, so the three have to be kept in step.
          #
          # An unauthorised lane gets one too, and leaves it pending: that is
          # what lets /retest find the run to re-run once the label is added,
          # and pending is what the lane in fact is until then.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state=pending \
            --field context='Trusted CI lane' \
            --field target_url="${RUN_URL}" \
            --field description="${DESCRIPTION}"

  # The lane is triggered when the untrusted run starts, not when it finishes,
  # so that the wait below is only for the artifacts it needs rather than for
  # every test the untrusted lane runs. Waiting for the whole run would put the
  # untrusted lane's slowest suite in front of everything here.
  wait-for-artifacts:
    name: wait-for-artifacts
    needs: [resolve]
    if: ${{ needs.resolve.outputs.proceed == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read # needed to read the untrusted run and its artifacts
    # Long enough to cover a cold amd64 build, and short enough to report a
    # stuck untrusted lane rather than sit out the six hour default.
    timeout-minutes: 180
    steps:
      - name: Wait for the untrusted run to upload what this lane consumes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # Keyed on the artifacts rather than on the job names, because the
          # artifacts are the actual dependency, and their names are all this
          # lane knows the untrusted jobs by.
          EXPECTED: |
            kata-deploy-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
            kata-monitor-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
            kata-tools-static-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
        run: |
          set -o errexit -o nounset -o pipefail

          deadline=$((SECONDS + 170 * 60))

          while :; do
            uploaded="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[].name')"

            missing=()
            while read -r want; do
              [[ -n "${want}" ]] || continue
              grep -qxF "${want}" <<< "${uploaded}" || missing+=("${want}")
            done <<< "${EXPECTED}"

            if [[ "${#missing[@]}" -eq 0 ]]; then
              echo "All expected artifacts are uploaded."
              break
            fi

            # The untrusted run reaching a terminal state without them means
            # they are never coming: a build failed, or the run was cancelled.
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')"
            if [[ "${status}" == "completed" ]]; then
              echo "::error::The untrusted run finished without uploading: ${missing[*]}"
              exit 1
            fi

            if [[ "${SECONDS}" -ge "${deadline}" ]]; then
              echo "::error::Gave up waiting for: ${missing[*]}"
              exit 1
            fi

            echo "Still waiting for ${#missing[@]} artifact(s): ${missing[*]}"
            sleep 60
          done

  # The label again, and this time immediately before it is acted on. resolve
  # read it seconds after the push, which is soon enough to start the lane and
  # far too early to be the last word: the artifacts take the better part of an
  # hour to arrive, and in that hour the pull request can be pushed to, the
  # label taken back by hand, or taken back by
  # .github/workflows/revoke-ok-to-test.yaml because the branch was rewritten.
  #
  # This job is what makes any of those effective, and what makes the timing of
  # that workflow unimportant: it does not matter whether the label goes before
  # or after resolve read it, only that it is gone by the time anything is
  # published or any test is run.
  authorise:
    name: authorise
    needs: [resolve, wait-for-artifacts]
    if: ${{ needs.resolve.outputs.proceed == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read # needed to re-read the label and the head commit
    steps:
      - name: Check the label still stands, and still stands for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIRED_LABEL: ok-to-test
        run: |
          set -o errexit -o nounset -o pipefail

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          if ! jq -e --arg want "${REQUIRED_LABEL}" \
              'any(.labels[]?.name; . == $want)' <<< "${pr}" > /dev/null; then
            echo "::error::${REQUIRED_LABEL} has been removed from pull request ${PR_NUMBER} since this run started, so it is no longer cleared to run. A maintainer can label it again and comment /retest."
            exit 1
          fi

          # And that it is still this commit the label sits on. A push moves the
          # branch on without the label noticing, and the concurrency group
          # cancels this run when it does - but a cancellation that lands
          # between the check above and the jobs below would be a gap, and this
          # closes it.
          head="$(jq -r '.head.sha' <<< "${pr}")"
          if [[ "${head}" != "${HEAD_SHA}" ]]; then
            echo "::error::Pull request ${PR_NUMBER} has moved from ${HEAD_SHA} to ${head}, so this run is testing a commit that is no longer under review."
            exit 1
          fi

          echo "Pull request ${PR_NUMBER} is labelled ${REQUIRED_LABEL} and still at ${HEAD_SHA}."

  # This is the whole point of the lane: the images exist, but only as docker
  # archives, because the lane that built them holds no credentials to push
  # them anywhere. Publishing them here is what puts them within reach of a
  # cluster that is not the runner itself, an AKS one above all.
  publish-images:
    name: publish-images
    needs: [resolve, wait-for-artifacts, authorise]
    if: ${{ needs.resolve.outputs.proceed == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read # needed to fetch the untrusted run's artifacts
      packages: write # needed to push the images to ghcr.io
    env:
      ARCHIVE_DIR: /tmp/kata-image-tarballs
    steps:
      - name: get-kata-deploy-image-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-deploy-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          path: ${{ env.ARCHIVE_DIR }}
          # Another run's artifacts, so this needs a token and the run to take
          # them from; without both, the action looks inside this run instead.
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: get-kata-monitor-image-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-monitor-image-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          path: ${{ env.ARCHIVE_DIR }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Kata Containers ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the images built by the untrusted lane
        env:
          # TEMPORARY, sandbox only: github.repository, where upstream wants
          # github.repository_owner. A token may only write a package its own
          # repository owns, and ghcr.io/kata-containers/kata-deploy-ci belongs
          # to kata-containers/kata-containers, so pushing it from here is
          # denied - write_package - however much permission the workflow asks
          # for. Naming the repository puts the package under this one instead,
          # which the first push creates and links here. Upstream the lane runs
          # in the repository that already owns the package and wants neither
          # this nor the matching change on the suite below.
          REGISTRY_PATH: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.resolve.outputs.tag }}-amd64
        run: |
          set -o errexit -o nounset -o pipefail

          # ghcr.io accepts lowercase repository paths only.
          path="${REGISTRY_PATH,,}"

          publish() {
            local archive="${1}"
            local repo="${2}"

            # The untrusted lane tags for localhost, a registry that cannot
            # serve the image, so that a side-load it failed to do surfaces as a
            # pull failure there instead of quietly passing. Here the tag has to
            # become one that does resolve.
            docker load --input "${ARCHIVE_DIR}/${archive}"
            docker tag "localhost/${repo}:${IMAGE_TAG}" "ghcr.io/${path}/${repo}:${IMAGE_TAG}"
            docker push "ghcr.io/${path}/${repo}:${IMAGE_TAG}"

            # Reclaim the space as we go: the runner would otherwise have to
            # hold every archive plus every image loaded out of them at once.
            rm -f "${ARCHIVE_DIR}/${archive}"
          }

          # kata-deploy runs the installation, and in job mode hands it to the
          # dispatcher, so both are needed. The dispatcher's repository name is
          # derived the way the build script and the helm chart derive it, with
          # the "-ci" suffix kept last.
          publish kata-deploy.tar kata-deploy-ci
          publish kata-deploy-job-dispatcher.tar kata-deploy-job-dispatcher-ci

          # Not needed by the suites here yet. It is published all the same, so
          # that the kata-monitor suites can move over without the images
          # arriving from two different lanes.
          publish kata-monitor.tar kata-monitor-ci

  # The suites fetch their artifacts by name from the run they are part of, and
  # the ones they want were uploaded to the untrusted run. Copying them over is
  # what lets every suite workflow stay exactly as it is: teaching each of them
  # to fetch from another run instead would mean an input, a token and a step in
  # all of them, for the benefit of this lane alone.
  #
  # Only small artifacts belong here. The image archives are big, and nothing
  # downstream reads them from an artifact anyway - publish-images turns them
  # into something the clusters can pull.
  restage-artifacts:
    name: restage-artifacts
    needs: [resolve, wait-for-artifacts, authorise]
    if: ${{ needs.resolve.outputs.proceed == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read # needed to fetch the untrusted run's artifacts
    steps:
      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          path: restaged
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: store-artifact kata-tools-static-tarball-amd64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ needs.resolve.outputs.tarball-suffix }}
          # Named file rather than the directory, so the artifact keeps the shape
          # the build gave it and a suite finds what it expects at the top.
          path: restaged/kata-tools-static.tar.zst
          # Nothing outside this run reads it, but a re-run of a suite days
          # later is one of the things this run is re-run for, and it reads it.
          retention-days: 7
          # Already-compressed tarball; deflating it again costs time and saves
          # close to nothing.
          compression-level: 0
          # The build having changed the layout under us should stop the lane
          # here, not surface as a puzzling failure inside a suite.
          if-no-files-found: error

  # The first suite to move. Its cluster is in Azure, so it cannot side-load an
  # image the way the untrusted lane's suites do, and provisioning it needs
  # credentials the untrusted lane will never hold.
  run-k8s-tests-on-aks:
    needs: [resolve, publish-images, restage-artifacts]
    if: ${{ needs.resolve.outputs.proceed == 'true' }}
    permissions:
      contents: read # needed by the suite to check out the harness
      id-token: write # needed for OIDC access to log into Azure
    uses: ./.github/workflows/run-k8s-tests-on-aks.yaml
    with:
      tarball-suffix: ${{ needs.resolve.outputs.tarball-suffix }}
      registry: ghcr.io
      # TEMPORARY, sandbox only: the other half of the change in publish-images
      # above - the images live under this repository's own package namespace
      # here, so this is where the suite has to pull them from.
      repo: ${{ github.repository }}/kata-deploy-ci
      tag: ${{ needs.resolve.outputs.tag }}-amd64
      # The pull request's own commit, and the same one the untrusted lane built
      # these artifacts from, so the tests and the binaries beneath them come
      # from one tree. A pull request that has to change both at once is
      # therefore exercised here as it will be once merged.
      commit-hash: ${{ github.event.workflow_run.head_sha }}
      # Which actions/checkout refuses from v7 on, this being a workflow_run of
      # a pull_request. Asking for it in as many words is the point: the label
      # resolve checked is what stands behind it.
      allow-unsafe-pr-checkout: true
      pr-number: ${{ needs.resolve.outputs.pr-number }}
      target-branch: ${{ needs.resolve.outputs.target-branch }}
    secrets:
      AZ_APPID: ${{ secrets.AZ_APPID }}
      AZ_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}
      AZ_SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}

  report:
    name: report
    needs: [resolve, wait-for-artifacts, authorise, publish-images, restage-artifacts, run-k8s-tests-on-aks]
    # always(), so that a failing suite still resolves the pending status the
    # resolve job left on the pull request.
    if: ${{ always() && needs.resolve.outputs.proceed == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      statuses: write # needed to resolve the status the resolve job left pending
    steps:
      - name: Report the lane's outcome on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -o errexit -o nounset -o pipefail

          # Mostly for the humans reading the pull request: Gatekeeper judges
          # this lane by the jobs of this run, not by the state of this status.
          #
          # skipped counts as success, for the jobs a lane deliberately leaves
          # out. A job skipped because something it needed did not succeed does
          # not hide that, since the job it needed is in here too.
          state=success
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) state=failure ;;
            esac
          done

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state="${state}" \
            --field context='Trusted CI lane' \
            --field target_url="${RUN_URL}" \
            --field description="The trusted lane finished with: ${RESULTS}"

          # This job runs on always(), which includes the lane having been
          # cancelled, so passing here would leave a green job - and a green run
          # conclusion - on top of a lane that never finished. Carry the verdict
          # into this job's own outcome, so that every way of looking at the run
          # agrees with the status just posted.
          if [[ "${state}" != "success" ]]; then
            echo "::error::The trusted lane did not succeed: ${RESULTS}"
            exit 1
          fi
