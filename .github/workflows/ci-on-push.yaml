name: Kata Containers CI (GitHub-hosted runners)

# The untrusted lane of the CI. Unlike ci-on-push-prt.yaml, this runs on
# pull_request, so it executes the pull request's own code with a read-only
# token and no repository secrets, and needs no 'ok-to-test' label: fork
# contributors get this coverage automatically on every push.
#
# It is therefore limited to work that needs neither secrets nor a published
# image: the amd64 and arm64 builds, plus the suites that run on GitHub-hosted
# runners. Everything else stays in ci-on-push-prt.yaml for now, because it
# needs one of:
#
#   - self-hosted runners (s390x, ppc64le, arm64, NVIDIA GPU, zVSI)
#   - AKS, and the Azure credentials to provision it
#
# The k8s suites do need the kata-deploy image, which a fork pull_request cannot
# push to ghcr.io for want of a write-scoped token. They get it as a docker
# archive instead: the image is built here like any other artifact, uploaded, and
# side-loaded into each test cluster's own image store. Only the suites whose
# cluster lives on the runner itself can do that, which rules out the AKS ones.

on:
  pull_request:
    branches:
      - 'main'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skipper:
    uses: ./.github/workflows/gatekeeper-skipper.yaml
    with:
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}

  build-kata-static-tarball-amd64:
    needs: skipper
    if: ${{ needs.skipper.outputs.skip_build != 'yes' }}
    permissions:
      contents: read
      # Unused on this path. Every ghcr.io push in the build (the ORAS tarball
      # cache and the build provenance attestation) is gated on
      # push-to-registry, which defaults to "no" and is only set by the release
      # and post-merge workflows. They are declared because a reusable workflow
      # may not request more than its caller grants, and the build workflow
      # declares them for the release path it shares. On a fork pull_request
      # the token is read-only regardless of what is requested here.
      packages: write # unused here; needed to call the shared build workflow
      id-token: write # unused here; needed to call the shared build workflow
      attestations: write # unused here; needed to call the shared build workflow
    uses: ./.github/workflows/build-kata-static-tarball-amd64.yaml
    with:
      tarball-suffix: -${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}

  # Build-only coverage: ubuntu-24.04-arm is GitHub-hosted, but every arm64 test
  # suite needs either a self-hosted runner or the published image, so there is
  # nothing here to run the result against yet.
  build-kata-static-tarball-arm64:
    needs: skipper
    if: ${{ needs.skipper.outputs.skip_build != 'yes' }}
    permissions:
      contents: read
      packages: write # unused here; needed to call the shared build workflow
      id-token: write # unused here; needed to call the shared build workflow
      attestations: write # unused here; needed to call the shared build workflow
    uses: ./.github/workflows/build-kata-static-tarball-arm64.yaml
    with:
      tarball-suffix: -${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}

  # The k8s suites below deploy Kata from a container image, which this lane
  # cannot push anywhere. So build it into a docker archive and pass it along as
  # an artifact, for each suite to side-load into its own cluster.
  build-kata-deploy-image-tarball-amd64:
    needs: [skipper, build-kata-static-tarball-amd64]
    if: ${{ needs.skipper.outputs.skip_test != 'yes' }}
    permissions:
      contents: read
      packages: write # unused here; needed to call the shared image workflow
    uses: ./.github/workflows/publish-kata-images.yaml
    with:
      tarball-suffix: -${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      # Nothing resolves this reference: the image never reaches a registry, and
      # the tests pull it from their own image store. Naming a registry that
      # cannot serve it is deliberate, so that a failed import surfaces as a
      # pull failure rather than as a stale image quietly passing the tests.
      registry: localhost
      repo: kata-deploy-ci
      tag: ${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-amd64
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}
      runner: ubuntu-22.04
      arch: amd64
      image-kind: deploy
      # Asking for a tarball is what turns the push off; there is no separate
      # switch to set here.
      image-tarball-artifact: kata-deploy-image-tarball-amd64-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

  build-kata-monitor-image-tarball-amd64:
    needs: [skipper, build-kata-static-tarball-amd64]
    if: ${{ needs.skipper.outputs.skip_test != 'yes' }}
    permissions:
      contents: read
      packages: write # unused here; needed to call the shared image workflow
    uses: ./.github/workflows/publish-kata-images.yaml
    with:
      tarball-suffix: -${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      registry: localhost
      repo: kata-monitor-ci
      tag: ${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-amd64
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}
      runner: ubuntu-22.04
      arch: amd64
      image-kind: monitor
      image-tarball-artifact: kata-monitor-image-tarball-amd64-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

  run-basic-amd64-tests:
    needs: [skipper, build-kata-static-tarball-amd64]
    if: ${{ needs.skipper.outputs.skip_test != 'yes' }}
    uses: ./.github/workflows/basic-ci-amd64.yaml
    with:
      tarball-suffix: -${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}

  run-cri-containerd-tests-amd64:
    needs: [skipper, build-kata-static-tarball-amd64]
    if: ${{ needs.skipper.outputs.skip_test != 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        params: [
          { containerd_version: latest,    vmm: clh              },
          { containerd_version: latest,    vmm: dragonball       },
          { containerd_version: latest,    vmm: qemu             },
          { containerd_version: latest,    vmm: clh-runtime-rs   },
          { containerd_version: latest,    vmm: qemu-runtime-rs  },
          { containerd_version: minimum, vmm: clh              },
          { containerd_version: minimum, vmm: dragonball       },
          { containerd_version: minimum, vmm: qemu             },
          { containerd_version: minimum, vmm: clh-runtime-rs   },
          { containerd_version: minimum, vmm: qemu-runtime-rs  },
        ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-cri-amd64-${{ toJSON(matrix) }}
      cancel-in-progress: true
    uses: ./.github/workflows/run-cri-containerd-tests.yaml
    with:
      tarball-suffix: -${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}
      runner: ubuntu-22.04
      arch: amd64
      containerd_version: ${{ matrix.params.containerd_version }}
      vmm: ${{ matrix.params.vmm }}

  run-k8s-tests-on-free-runner:
    needs: [skipper, build-kata-deploy-image-tarball-amd64]
    if: ${{ needs.skipper.outputs.skip_test != 'yes' }}
    permissions:
      # This suite is the one that asks for a permission of its own, so it is
      # the one job here that has to be granted anything: a call that requests
      # more than the caller was given is rejected before the run starts, and
      # the workflow-level default above grants nothing.
      contents: read
    uses: ./.github/workflows/run-k8s-tests-on-free-runner.yaml
    with:
      tarball-suffix: -${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      registry: localhost
      repo: kata-deploy-ci
      tag: ${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-amd64
      commit-hash: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      target-branch: ${{ github.event.pull_request.base.ref }}
      image-tarball-artifact: kata-deploy-image-tarball-amd64-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

  run-kata-deploy-tests:
    needs: [skipper, build-kata-deploy-image-tarball-amd64]
    if: ${{ needs.skipper.outputs.skip_test != 'yes' }}
    uses: ./.github/workflows/run-kata-deploy-tests.yaml
    with:
      registry: localhost
      repo: kata-deploy-ci
      tag: ${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-amd64
      commit-hash: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      target-branch: ${{ github.event.pull_request.base.ref }}
      image-tarball-artifact: kata-deploy-image-tarball-amd64-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

  run-kata-monitor-k8s-tests:
    needs: [skipper, build-kata-deploy-image-tarball-amd64, build-kata-monitor-image-tarball-amd64]
    if: ${{ needs.skipper.outputs.skip_test != 'yes' }}
    uses: ./.github/workflows/run-kata-monitor-k8s-tests.yaml
    with:
      registry: localhost
      repo: kata-deploy-ci
      tag: ${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-amd64
      commit-hash: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      target-branch: ${{ github.event.pull_request.base.ref }}
      kata-monitor-image-reference: localhost/kata-monitor-ci
      kata-monitor-image-tag: ${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-amd64
      image-tarball-artifact: kata-deploy-image-tarball-amd64-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      kata-monitor-image-tarball-artifact: kata-monitor-image-tarball-amd64-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
