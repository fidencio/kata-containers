name: zz probe ref creation

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Can the Actions token delete a branch carrying workflow changes?
        run: |
          set -o errexit -o nounset -o pipefail
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/zz-probe/delete-me" \
              --method DELETE 2>&1)"; then
            echo "RESULT delete: ALLOWED"
          else
            echo "RESULT delete: REFUSED -- $(tr -d '\n' <<< "${out}")"
          fi
