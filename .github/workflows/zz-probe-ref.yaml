name: zz probe ref creation

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-22.04
    environment:
      name: zz-probe-env
      deployment: false
    steps:
      - name: Can this ref reach the environment's secret?
        env:
          SECRET: ${{ secrets.ZZ_PROBE_SECRET }}
        run: |
          set -o errexit -o nounset -o pipefail
          echo "ref=${GITHUB_REF}"
          if [[ -n "${SECRET:-}" ]]; then
            echo "RESULT: the environment secret IS readable here"
          else
            echo "RESULT: the environment secret is EMPTY here"
          fi
