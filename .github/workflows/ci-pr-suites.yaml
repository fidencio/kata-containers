name: Kata Containers CI (dispatched)

# The suites that need this repository's credentials, run from the pull
# request's own workflow files.
#
# This is the answer to the one real hole left by the workflow_run design: a
# privileged trigger reads its workflow file from the default branch, and so does
# every reusable workflow it reaches through uses: ./ - which meant a pull
# request could change run-k8s-tests-on-aks.yaml and have the default branch's
# copy run instead, green, having tested none of it. The only trigger that reads
# its workflow file from somewhere else is workflow_dispatch, which takes it from
# the ref it is dispatched on. And that ref has to be a branch of this
# repository: refs/pull/N/head is refused outright.
#
# So the trusted lane puts the pull request's commit on a branch of this
# repository, ci/pr-<number>, and dispatches this workflow there. Everything
# below is then the pull request's: this file, run-k8s-tests-on-aks.yaml beneath
# it, and the tests/ they run. A change to any of it is exercised before it
# merges, which is the whole point.
#
# What that costs has to be said plainly, because it is the thing the split was
# made to get rid of: a dispatched run is privileged and its YAML is a fork's, so
# it can name any secret this repository holds and ask for any token scope the
# repository allows. ok-to-test is what stands in front of it, exactly as it does
# on the pull_request_target lane.
#
# Two things do help, and neither is in this file:
#
#   - the repository's default GITHUB_TOKEN permissions set to read-only. A
#     workflow may only reduce what the repository allows, never exceed it, so
#     that is what stops a fork's YAML asking for packages: write. Publishing
#     stays in the trusted lane, which is always the default branch's code.
#   - the credentials that matter in an Environment whose deployment branch
#     policy names only the default branch. A job dispatched on ci/pr-<number>
#     that asks for such an environment does not start at all, which is how the
#     token the trusted lane uses to write this branch is kept out of reach of
#     the YAML on it. Required reviewers do the same job per run, at the cost of
#     a click each time.
#
# That branch is written with a credential of the project's own, not with
# GITHUB_TOKEN: GitHub refuses an App token any ref write that changes
# .github/workflows/, and those changes are the point. ci-on-push-trusted.yaml
# says what the credential needs to be and where it has to live.
#
# What does not help, and is worth writing down so nobody reaches for it: scoping
# the Azure federated credential by OIDC subject. The subject names a path and a
# ref - and both are the same whether the file came from the default branch or
# from a fork, since this design puts the fork's copy at that very path on a
# branch of this repository. Subject scoping cannot tell the two apart.
#
# The suites use the "ci" environment. It must not carry a deployment branch
# policy that excludes ci/pr-*, or nothing here starts at all.

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: The pull request whose commit this branch carries
        required: true
        type: string
      tarball-suffix:
        description: Suffix the untrusted lane named its artifacts with
        required: true
        type: string
      registry:
        description: Registry the trusted lane published the images to
        required: true
        type: string
      repo:
        description: Repository path of the kata-deploy image
        required: true
        type: string
      tag:
        description: Tag of the published images
        required: true
        type: string
      target-branch:
        description: Branch the pull request is against
        required: true
        type: string
      artifact-run-id:
        description: Untrusted lane's run, which holds the artifacts
        required: true
        type: string

permissions: {}

concurrency:
  # Keyed on the pull request rather than on the branch, which amounts to the
  # same thing here and keeps this in step with the suites below.
  group: ${{ github.workflow }}-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  # The suites fetch their artifacts by name from the run they are part of, and
  # the ones they want were uploaded to the untrusted lane's run. Copying them
  # into this run is what lets every suite workflow stay exactly as it is.
  #
  # Only small artifacts belong here. The image archives are big, and nothing
  # downstream reads them from an artifact anyway - the trusted lane has already
  # turned them into something a cluster can pull.
  restage-artifacts:
    name: restage-artifacts
    runs-on: ubuntu-22.04
    permissions:
      actions: read # needed to fetch the untrusted run's artifacts
    steps:
      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ inputs.tarball-suffix }}
          path: restaged
          # Another run's artifacts, so this needs a token and the run to take
          # them from; without both, the action looks inside this run instead.
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: store-artifact kata-tools-static-tarball-amd64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ inputs.tarball-suffix }}
          # Named file rather than the directory, so the artifact keeps the shape
          # the build gave it and a suite finds what it expects at the top.
          path: restaged/kata-tools-static.tar.zst
          # Nothing outside this run reads it, but a re-run of a suite days
          # later is one of the things this run is re-run for, and it reads it.
          retention-days: 7
          # Already-compressed tarball; deflating it again costs time and saves
          # close to nothing.
          compression-level: 0
          # The build having changed the layout under us should stop this here,
          # not surface as a puzzling failure inside a suite.
          if-no-files-found: error

  run-k8s-tests-on-aks:
    needs: [restage-artifacts]
    permissions:
      contents: read # needed by the suite to check out the harness
      id-token: write # needed for OIDC access to log into Azure
    # Resolved from this branch, because uses: ./ takes the same commit as the
    # workflow that says it - which here is the pull request's. That is the
    # difference between this lane and calling the suite from the trusted one.
    uses: ./.github/workflows/run-k8s-tests-on-aks.yaml
    with:
      tarball-suffix: ${{ inputs.tarball-suffix }}
      registry: ${{ inputs.registry }}
      repo: ${{ inputs.repo }}
      tag: ${{ inputs.tag }}
      # The branch's tip, which is the commit the untrusted lane built the
      # artifacts from. No allow-unsafe-pr-checkout: this is a branch of this
      # repository and a workflow_dispatch, not a fork's pull request, so
      # actions/checkout has nothing to refuse. The suite rebases onto the
      # target branch itself, a step later.
      commit-hash: ${{ github.sha }}
      pr-number: ${{ inputs.pr-number }}
      target-branch: ${{ inputs.target-branch }}
    secrets:
      AZ_APPID: ${{ secrets.AZ_APPID }}
      AZ_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}
      AZ_SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}
