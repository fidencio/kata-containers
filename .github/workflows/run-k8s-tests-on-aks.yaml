name: CI | Run kubernetes tests on AKS
on:
  workflow_call:
    inputs:
      tarball-suffix:
        required: false
        type: string
      registry:
        required: true
        type: string
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      commit-hash:
        required: false
        type: string
      allow-unsafe-pr-checkout:
        # For a caller whose event is privileged and whose commit-hash is a
        # fork's: actions/checkout refuses that pairing from v7 on, and a caller
        # that means it has to say so. One does - the pull_request_target lane,
        # which reaches this suite through ci.yaml - and it goes when that lane
        # does. The trusted lane needs nothing here: it dispatches this suite on
        # a branch of this repository instead, so there is no fork ref to refuse
        # (see .github/workflows/ci-pr-suites.yaml).
        required: false
        type: boolean
        default: false
      target-branch:
        required: false
        type: string
        default: ""
    secrets:

      AZ_APPID:
        required: true
      AZ_TENANT_ID:
        required: true
      AZ_SUBSCRIPTION_ID:
        required: true

concurrency:
  # pr-number, rather than the event's pull request: it is required, it is set
  # to "nightly" or "dev" by those lanes, and it is the only thing that tells
  # one pull request from another in a lane that is not triggered by the pull
  # request itself. github.event.pull_request is empty there, which would land
  # every pull request in a single group, each cancelling the last.
  group: ${{ github.workflow }}-${{ inputs.pr-number }}-aks
  cancel-in-progress: true

permissions: {}

jobs:
  run-k8s-tests:
    name: run-k8s-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - host_os: cbl-mariner
            vmm: clh-azure
            instance-type: small
            genpolicy-pull-method: oci-distribution
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ inputs.pr-number }}-run-k8s-tests-aks-${{ toJSON(matrix) }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # Used for OIDC access to log into Azure
    environment:
      name: ci
      deployment: false
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_HOST_OS: ${{ matrix.host_os }}
      KATA_HYPERVISOR: ${{ matrix.vmm }}
      KUBERNETES: "vanilla"
      K8S_TEST_HOST_TYPE: ${{ matrix.instance-type }}
      GENPOLICY_PULL_METHOD: ${{ matrix.genpolicy-pull-method }}
      RUNS_ON_AKS: "true"
    steps:
      # Ahead of the rest of the repository, deliberately: this is the first
      # suite whose privileged callers check out a fork, so it is the one that
      # has to face the guard rather than be handed it by a later bump. Every
      # caller that needs the opt-out below therefore says so today, and is
      # tested saying so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-hash }}
          allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-pr-checkout }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ inputs.tarball-suffix }}
          path: kata-tools-artifacts

      - name: Install kata-tools
        run: bash tests/integration/kubernetes/gha-run.sh install-kata-tools kata-tools-artifacts

      - name: Download Azure CLI
        uses: azure/setup-kubectl@15650b3ad78fff148532a140b8a4c821796b2d7b # v5.0.0
        with:
          version: 'latest'

      - name: Log into the Azure account
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZ_APPID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}

      - name: Create AKS cluster
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 10
          command: bash tests/integration/kubernetes/gha-run.sh create-cluster

      - name: Install `bats`
        run: bash tests/integration/kubernetes/gha-run.sh install-bats

      - name: Install `kubectl`
        uses: azure/setup-kubectl@15650b3ad78fff148532a140b8a4c821796b2d7b # v5.0.0
        with:
          version: 'latest'

      - name: Download credentials for the Kubernetes CLI to use them
        run: bash tests/integration/kubernetes/gha-run.sh get-cluster-credentials

      - name: Deploy Kata
        timeout-minutes: 20
        run: bash tests/integration/kubernetes/gha-run.sh deploy-kata-aks

      - name: Run tests
        timeout-minutes: 60
        run: bash tests/integration/kubernetes/gha-run.sh run-tests

      - name: Report tests
        if: always()
        run: bash tests/integration/kubernetes/gha-run.sh report-tests

      - name: Refresh OIDC token in case access token expired
        if: always()
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZ_APPID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}

      - name: Delete AKS cluster
        if: always()
        run: bash tests/integration/kubernetes/gha-run.sh delete-cluster
