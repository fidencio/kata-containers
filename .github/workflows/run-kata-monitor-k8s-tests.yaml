name: CI | Run kata-monitor k8s tests
on:
  workflow_call:
    inputs:
      registry:
        description: Registry of the kata-deploy image under test.
        required: true
        type: string
      repo:
        description: Repository of the kata-deploy image under test.
        required: true
        type: string
      tag:
        description: Tag of the kata-deploy image under test.
        required: true
        type: string
      pr-number:
        required: true
        type: string
      commit-hash:
        required: false
        type: string
      target-branch:
        required: false
        type: string
        default: ""
      kata-monitor-image-reference:
        description: Registry/repo of the kata-monitor image to exercise.
        required: true
        type: string
      kata-monitor-image-tag:
        description: Tag of the kata-monitor image to exercise.
        required: true
        type: string
      image-tarball-artifact:
        description: >
          Artifact holding the kata-deploy image as a docker archive. When set,
          the image is side-loaded into the cluster from there instead of being
          pulled from `registry`/`repo`, which is what lets this suite run in a
          lane that cannot push to a registry.
        required: false
        type: string
        default: ""
      kata-monitor-image-tarball-artifact:
        description: >
          Same, for the kata-monitor image. This suite deploys two images, and
          side-loading only one of them would still leave it needing a registry.
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-kata-monitor-k8s
  cancel-in-progress: true

permissions: {}

jobs:
  run-kata-monitor-k8s-tests:
    name: run-kata-monitor-k8s-tests
    strategy:
      fail-fast: false
      matrix:
        vmm:
          - qemu
        k8s:
          - vanilla
    concurrency:
      group: ${{ github.workflow }}-run-kata-monitor-k8s-tests-${{ github.event.pull_request.number || github.ref }}-${{ toJSON(matrix) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_HYPERVISOR: ${{ matrix.vmm }}
      KUBERNETES: ${{ matrix.k8s }}
      CONTAINER_ENGINE: containerd
      CONTAINER_ENGINE_VERSION: latest
      KATA_MONITOR_IMAGE_REFERENCE: ${{ inputs.kata-monitor-image-reference }}
      KATA_MONITOR_IMAGE_TAG: ${{ inputs.kata-monitor-image-tag }}
      GH_TOKEN: ${{ github.token }}
      # Set only when the images arrive as artifacts: it tells the test scripts
      # both where to import them from and to stop expecting a registry to have
      # them.
      KATA_IMAGE_TARBALL_DIR: ${{ inputs.image-tarball-artifact != '' && '/tmp/kata-image-tarballs' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: Remove unnecessary directories to free up space
        run: |
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /usr/lib/firefox

      - name: Deploy ${{ matrix.k8s }}
        run:  bash tests/functional/kata-deploy/gha-run.sh deploy-k8s

      - name: get-kata-deploy-image-tarball
        if: ${{ inputs.image-tarball-artifact != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.image-tarball-artifact }}
          path: ${{ env.KATA_IMAGE_TARBALL_DIR }}

      - name: get-kata-monitor-image-tarball
        if: ${{ inputs.kata-monitor-image-tarball-artifact != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.kata-monitor-image-tarball-artifact }}
          path: ${{ env.KATA_IMAGE_TARBALL_DIR }}

      # Imports every archive in the directory, so both images land in one pass.
      # Each is deleted as it goes: the runner has to hold both the archive and
      # the unpacked image otherwise.
      - name: Import the images into the cluster
        if: ${{ inputs.image-tarball-artifact != '' }}
        run: bash tests/functional/kata-deploy/gha-run.sh import-image-archives

      - name: Install `bats`
        run: bash tests/functional/kata-deploy/gha-run.sh install-bats

      - name: Run tests
        run: bash tests/functional/kata-monitor/gha-run.sh run-helm-tests

      - name: Report tests
        if: always()
        run: bash tests/functional/kata-monitor/gha-run.sh report-helm-tests
