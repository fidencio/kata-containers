# The static checks that need a runner GitHub does not hand out: arm64, s390x
# and ppc64le. They run on every push to every pull request, fork or not, with
# no label in the way.
#
# That means a fork's code compiles and its unit tests run on machines the
# project owns, which is a risk taken deliberately: a static check nobody sees
# until a maintainer remembers to ask for it is a check that stops being run,
# and the alternative on offer - a label - is what left contributors waiting on
# a maintainer's afternoon in the first place. The event is pull_request, so
# none of this comes near a secret.
#
# Label events are deliberately not in the list below. Nothing here reads a
# label, so a label arriving or leaving has nothing to say about these checks,
# and having it re-run the whole matrix was pure waste.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Static checks self-hosted
jobs:
  skipper:
    uses: ./.github/workflows/gatekeeper-skipper.yaml
    with:
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}

  build-checks:
    needs: skipper
    if: ${{ needs.skipper.outputs.skip_static != 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        instance:
          - "ubuntu-24.04-arm"
          # TEMPORARY, and only while the two new lanes are being proven in this
          # sandbox: the same silencing as in ci.yaml and in the matching entries
          # of tools/testing/gatekeeper/required-tests.yaml. Neither runner
          # exists here, and until now the label was what kept these from
          # queueing forever. Restore all three together.
          # - "ubuntu-24.04-s390x"
          # - "ppc64le"
    uses: ./.github/workflows/build-checks.yaml
    with:
      instance: ${{ matrix.instance }}
