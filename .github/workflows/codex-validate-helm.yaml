name: Validate Helm 4.3.1
on:
  push:
    branches: [codex/validate-helm-4.3.1-20261107]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14f368c2db6f7b86449459d2a372e3c5379e08df
          fetch-depth: 0
          persist-credentials: false
      - name: Verify component commit and read Helm pin
        id: helm-version
        env:
          INSTALL_IN_GOPATH: 'false'
        run: |
          test "$(git rev-parse HEAD)" = "14f368c2db6f7b86449459d2a372e3c5379e08df"
          test "$(git rev-parse HEAD^)" = "8fd86af5a8099749e0b4a01339abee7056ea1970"
          git diff --check HEAD^ HEAD
          bash -n tests/common.bash
          ./ci/install_yq.sh
          version=$(yq -e '.externals.helm.version' versions.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Helm as in release and payload workflows
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814
        with:
          version: ${{ steps.helm-version.outputs.version }}
      - name: Package and render chart without publication
        run: |
          test "$(helm version --template '{{.Version}}')" = "v4.3.1"
          src=tools/packaging/kata-deploy/helm-chart/kata-deploy
          temp="$(mktemp -d)"
          cp -R "$src" "$temp/kata-deploy"
          yq eval '.version = "0.0.0-validation" | .appVersion = "0.0.0-validation"' -i "$temp/kata-deploy/Chart.yaml"
          yq eval '.image.reference = "quay.io/kata-containers/kata-deploy" | .image.tag = "validation"' -i "$temp/kata-deploy/values.yaml"
          helm package "$temp/kata-deploy" -d "$temp"
          chart="$temp/kata-deploy-0.0.0-validation.tgz"
          helm lint "$chart"
          helm template kata-deploy "$chart" > "$temp/rendered.yaml"
          test -s "$temp/rendered.yaml"
          sha256sum "$chart"
          helm show chart "$chart"
  templates:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14f368c2db6f7b86449459d2a372e3c5379e08df
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository Helm pin and run cluster-free template tests
        env:
          USE_SUDO: 'false'
          HELM_INSTALL_DIR: ${{ runner.temp }}/helm-bin
          target_branch: main
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          mkdir -p "$HELM_INSTALL_DIR"
          export PATH="$HELM_INSTALL_DIR:$PATH"
          source tests/common.bash
          ensure_helm
          test "$(helm version --template '{{.Version}}')" = "v4.3.1"
          bats tests/functional/kata-deploy/kata-deploy-multi-install.bats
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14f368c2db6f7b86449459d2a372e3c5379e08df
          fetch-depth: 0
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: '1.7.12'
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14f368c2db6f7b86449459d2a372e3c5379e08df
          fetch-depth: 0
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@135698455da5c3b3e55f73f4419e481ab68cdd95
        with:
          advanced-security: false
          annotations: true
          persona: auditor
          version: v1.22.0
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14f368c2db6f7b86449459d2a372e3c5379e08df
          fetch-depth: 0
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          severity: style
          ignore_paths: >-
            **/vendor/**
            tests/metrics
            tests/integration/stdio
          ignore_names: >-
            gha-stability-run.sh
            kubernetes_stability.sh
            kubernetes_stressng.sh
            kubernetes_soak_test.sh
            kata-manager.sh
          additional_files: tests/common.bash
  run-kata-deploy-tests:
    name: run-kata-deploy-tests (${{ matrix.environment.vmm }}, ${{ matrix.environment.k8s }})
    strategy:
      fail-fast: false
      matrix:
        environment: [
          { vmm: qemu-runtime-rs, k8s: k0s },
          { vmm: qemu-runtime-rs, k8s: k3s },
          { vmm: qemu-runtime-rs, k8s: rke2 },
          { vmm: qemu-runtime-rs, k8s: microk8s },
          { vmm: qemu-nvidia-cpu-runtime-rs, k8s: kubeadm, snapshotter: erofs, erofs_snapshotter_mode: disk, erofs_dmverity: dmverity },
        ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-${{ toJSON(matrix) }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DOCKER_REGISTRY: quay.io
      DOCKER_REPO: kata-containers/kata-deploy-ci
      DOCKER_TAG: kata-containers-latest
      GH_PR_NUMBER: ''
      KATA_HYPERVISOR: ${{ matrix.environment.vmm }}
      KUBERNETES: ${{ matrix.environment.k8s }}
      # Only used when deploying the kubeadm flavour
      CONTAINER_ENGINE: containerd
      CONTAINER_ENGINE_VERSION: latest
      # Only the kubeadm flavour runs EROFS, so that is where the host module
      # coverage lives: nothing loads them but the install itself.
      SNAPSHOTTER: ${{ matrix.environment.snapshotter }}
      EROFS_SNAPSHOTTER_MODE: ${{ matrix.environment.erofs_snapshotter_mode }}
      EROFS_DMVERITY: ${{ matrix.environment.erofs_dmverity }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 14f368c2db6f7b86449459d2a372e3c5379e08df
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact component commit and upstream parent
        run: |
          test "$(git rev-parse HEAD)" = "14f368c2db6f7b86449459d2a372e3c5379e08df"
          test "$(git rev-parse HEAD^)" = "8fd86af5a8099749e0b4a01339abee7056ea1970"

      - name: Remove unnecessary directories to free up space
        run: |
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /usr/lib/firefox

      - name: Deploy ${{ matrix.environment.k8s }}
        run:  bash tests/functional/kata-deploy/gha-run.sh deploy-k8s

      - name: Install `bats`
        run: bash tests/functional/kata-deploy/gha-run.sh install-bats

      - name: Run tests
        run: bash tests/functional/kata-deploy/gha-run.sh run-tests

      - name: Report tests
        if: always()
        run: bash tests/functional/kata-deploy/gha-run.sh report-tests

  # This runner is a cluster on an enforcing node.
  run-kata-deploy-selinux-tests:
    name: run-kata-deploy-selinux-tests
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: kata-deploy-selinux
    env:
      DOCKER_REGISTRY: quay.io
      DOCKER_REPO: kata-containers/kata-deploy-ci
      DOCKER_TAG: kata-containers-latest
      GH_PR_NUMBER: ''
      KATA_HYPERVISOR: qemu-runtime-rs
      KUBERNETES: rke2
      # The rest of the suite is not SELinux-specific and stays on the hosted runners.
      KATA_DEPLOY_TEST_UNION: >-
        kata-deploy-selinux-job.bats
        kata-deploy-selinux-daemonset.bats
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 14f368c2db6f7b86449459d2a372e3c5379e08df
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact component commit and upstream parent
        run: |
          test "$(git rev-parse HEAD)" = "14f368c2db6f7b86449459d2a372e3c5379e08df"
          test "$(git rev-parse HEAD^)" = "8fd86af5a8099749e0b4a01339abee7056ea1970"

      - name: Run tests
        timeout-minutes: 60
        run: bash tests/functional/kata-deploy/gha-run.sh run-tests

      - name: Report tests
        if: always()
        run: bash tests/functional/kata-deploy/gha-run.sh report-tests
