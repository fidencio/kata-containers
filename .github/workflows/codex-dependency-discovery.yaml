name: Discover published dependency artifacts
on:
  push:
    branches: [codex/discover-dependencies-20261106]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Public upstream release and tag metadata
        run: |
          set -euo pipefail
          mkdir evidence
          for component in nvrc open-gpu-kernel-modules nvidia-container-toolkit DCGM dcgm-exporter attestation-sdk; do
            echo "UPSTREAM NVIDIA/${component}"
            curl --fail --retry 2 --silent --show-error "https://api.github.com/repos/NVIDIA/${component}/releases?per_page=100" -o "evidence/${component}-releases.json" || continue
            jq -c '[.[] | select(.draft == false and .prerelease == false) | {tag_name,html_url,published_at,assets:[.assets[] | {name,digest,browser_download_url}]}] | .[0:5]' "evidence/${component}-releases.json"
            curl --fail --retry 2 --silent --show-error "https://api.github.com/repos/NVIDIA/${component}/tags?per_page=100" -o "evidence/${component}-tags.json" || continue
            jq -c '.[0:5] | map({name,commit})' "evidence/${component}-tags.json"
          done
      - name: Verify published pause image tag and supported Linux architectures
        run: |
          set -euo pipefail
          docker buildx imagetools inspect registry.k8s.io/pause:3.10.2 --raw | tee evidence/pause-3.10.2-manifest.json | jq -c '[.manifests[] | {digest,platform}]'
      - name: Verify distribution package availability for candidate GPU stack
        run: |
          set -euo pipefail
          for arch in x86_64 sbsa; do
            echo "PACKAGE_INDEX ${arch}"
            curl --fail --retry 2 --silent --show-error "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/${arch}/Packages.gz" | gzip -dc > "evidence/packages-${arch}"
            awk 'BEGIN {RS=""; FS="\\n"} /Package: (nvidia-driver-pinning|nvidia-driver-620|cuda-drivers|nvidia-container-toolkit|datacenter-gpu-manager|dcgm-exporter|nvattest|libnvat)/ {for (i=1;i<=NF;i++) if ($i ~ /^(Package|Version|Filename):/) print $i; print ""}' "evidence/packages-${arch}"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: upstream-release-evidence-20261106
          path: evidence/
          retention-days: 15
