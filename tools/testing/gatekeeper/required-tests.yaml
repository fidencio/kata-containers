required_tests:
  # Always required tests
  - Commit Message Check / Commit Message Check
  - Pull request WIP checks / WIP Check
  - Darwin tests / test
  - Shellcheck required / shellcheck-required
  - GHA security analysis / zizmor
  - Lint GHA workflows / run-actionlint
  - EditorConfig checker / editorconfig-checker

required_regexps:
  # Always required regexps

paths:
  # Mapping of path (python) regexps to set-of-tests (sort by order of importance)
  # CI
  - "^ci/openshift-ci/": []
  - "^\\.github/workflows/static-checks": ["static"]
  # A change to a workflow used to require nothing at all, which the trusted
  # lane makes untenable: it resolves its workflows from the default branch, so
  # a pull request's changes to them are exercised by the lanes that run the
  # pull request's own workflow files, and not by that one. There is no fixing
  # that from here - it is what workflow_run is - so the answer is to keep the
  # trusted lane's own YAML thin and its logic in tests/, which it does check
  # out from the pull request.
  - "^\\.github/workflows/": ["test", "test-trusted", "test-prt"]
  - "^docs/": ["static"]
  - "^mkdocs\\.yaml$": ["static"]
  - "\\.md$": ["static"]
  - "^tests/spellcheck/kata-dictionary.txt": ["static"]
  # The harness, and last of the tests/ rules on purpose: the first pattern a
  # file matches is the only one that counts, so anything narrower under tests/
  # has to come above this.
  #
  # Both new lanes run the pull request's own tests/ - the untrusted one because
  # that is all it ever runs, the trusted one at the very commit its artifacts
  # were built from - so a change here is exercised by whichever lane covers the
  # suite it touches, and needs nothing from pull_request_target. Until now this
  # matched no rule at all and so required every set, this being the accident
  # that covered the harness while the trusted lane still ran the base branch's.
  - "^tests/": ["test", "test-trusted", "static"]
  - "^\\.claude/": []
  # TODO: Expand filters
  # Sources
  #- "^src/": ["static", "build", "test"]

mapping:
  # Mapping of set-of-tests to required test names and/or test name regexps
  #
  # Format is (test name includes workflow!):
  # {set-of-tests-label}:
  #   names:
  #     - {required-test-name1}
  #     - {required-test-name2}
  #   regexps: "{python-regular-expression-matching-required-tests}|{another-regexp}|{yet-another-regexp}"
  #   required-labels:
  #     - {label-required-to-run-those-tests}
  #
  # TODO: Add support for "depends" to automatically add dependant set-of-tests
  #       (eg. "build" is required for "test")
  # TODO: Add support for "ignore:" to remove individual tests from regexps
  test:
