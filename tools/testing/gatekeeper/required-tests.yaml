  test-prt:
    # The suites that only the pull_request_target lane can run, each for one of
    # two reasons: they need a build on a self-hosted runner (s390x), or an image
    # that lane is still the only one to publish (the confidential guest image,
    # the NVIDIA ones). Moving a suite out of here is what shrinks that lane.
    #
    # This set is also what covers a pull request's own harness. The trusted
    # lane deliberately runs the base branch's tests/, so a change to the
    # harness is only ever exercised by the lane that runs the pull request's
    # code. tests/ matches no rule under paths above and so requires every set,
    # this one included; that is worth leaving alone, and it is why the
    # workflows now ask for this set explicitly.
    names:
      # ci-on-push-prt.yaml (ci.yaml)
      # TEMPORARY, sandbox only: the s390x entries are commented out along with
      # the jobs themselves in ci.yaml, so that a run here can be read for what
      # the new lanes cover. Restore both together.
      # - Kata Containers CI / kata-containers-ci-on-push / run-cri-containerd-tests-s390x (latest, qemu) / run-cri-containerd-s390x (latest, qemu)
      # - Kata Containers CI / kata-containers-ci-on-push / run-k8s-tests-on-zvsi / run-k8s-tests (devmapper, qemu, kubeadm)
      # - Kata Containers CI / kata-containers-ci-on-push / run-k8s-tests-on-zvsi / run-k8s-tests (nydus, qemu-coco-dev, kubeadm)
      #- Kata Containers CI / kata-containers-ci-on-push / run-k8s-tests-on-arm64 / run-k8s-tests-on-arm64 (qemu, kubeadm)
      - Kata Containers CI / kata-containers-ci-on-push / run-kata-coco-tests / run-k8s-tests-on-tee (sev-snp, qemu-snp)
      - Kata Containers CI / kata-containers-ci-on-push / run-kata-coco-tests / run-k8s-tests-coco-nontee (qemu-coco-dev, nydus, guest-pull)
      - Kata Containers CI / kata-containers-ci-on-push / run-kata-coco-tests / run-k8s-tests-coco-nontee (qemu-coco-dev-runtime-rs, nydus, guest-pull)
      - Kata Containers CI / kata-containers-ci-on-push / run-k8s-tests-on-nvidia-gpu / run-nvidia-gpu-tests-on-amd64
      # - Kata Containers CI / kata-containers-ci-on-push / run-k8s-tests-on-nvidia-gpu / run-nvidia-gpu-snp-tests-on-amd64
    required-labels:
      # That lane runs a fork's code with every secret the repository holds, so
      # it stays behind a maintainer having read the diff.
      - ok-to-test-prt
