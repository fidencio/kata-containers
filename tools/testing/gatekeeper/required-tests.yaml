required_tests:
  # Always required tests
  - Commit Message Check / Commit Message Check
  - Pull request WIP checks / WIP Check
  - Darwin tests / test
  - Shellcheck required / shellcheck-required
  - GHA security analysis / zizmor
  - Lint GHA workflows / run-actionlint
  - EditorConfig checker / editorconfig-checker

required_regexps:
  # Always required regexps

paths:
  # Mapping of path (python) regexps to set-of-tests (sort by order of importance)
  # CI
  - "^ci/openshift-ci/": []
  - "^\\.github/workflows/static-checks": ["static"]
  # A change to a workflow used to require nothing at all, which the trusted
  # lane makes untenable: it resolves its workflows from the default branch, so
  # a pull request's changes to them go unexercised unless the
  # pull_request_target lane runs, that being the one lane that runs a pull
  # request's own code.
  - "^\\.github/workflows/": ["test", "test-prt"]
  - "^docs/": ["static"]
  - "^mkdocs\\.yaml$": ["static"]
  - "\\.md$": ["static"]
  - "^tests/spellcheck/kata-dictionary.txt": ["static"]
  - "^\\.claude/": []
  # TODO: Expand filters
  # Sources
  #- "^src/": ["static", "build", "test"]

mapping:
  # Mapping of set-of-tests to required test names and/or test name regexps
  #
  # Format is (test name includes workflow!):
  # {set-of-tests-label}:
  #   names:
  #     - {required-test-name1}
  #     - {required-test-name2}
  #   regexps: "{python-regular-expression-matching-required-tests}|{another-regexp}|{yet-another-regexp}"
  #   required-labels:
  #     - {label-required-to-run-those-tests}
  #
  # TODO: Add support for "depends" to automatically add dependant set-of-tests
  #       (eg. "build" is required for "test")
  # TODO: Add support for "ignore:" to remove individual tests from regexps
  test:
    # Checks the basic functional tests work.
    #
    # Nothing here waits on a label. The untrusted lane runs on every push to
    # every pull request, fork or not, and the trusted lane it triggers runs the
    # base branch's harness against that lane's artifacts, so neither one has a
    # fork's code to be trusted with.
    names:
      # ci-on-push.yaml, the untrusted lane
      - Kata Containers CI (GitHub-hosted runners) / run-basic-amd64-tests / run-containerd-stability (latest, clh)
      - Kata Containers CI (GitHub-hosted runners) / run-basic-amd64-tests / run-containerd-stability (latest, clh-runtime-rs)
      - Kata Containers CI (GitHub-hosted runners) / run-basic-amd64-tests / run-containerd-stability (latest, dragonball)
