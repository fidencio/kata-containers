  test-trusted:
    # The suites the untrusted lane cannot run, because they need a cluster that
    # is not the runner itself and credentials to raise it.
    #
    # The lane builds nothing: it runs the pull request's tests/ against the
    # artifacts the untrusted lane built, publishes those under this
    # repository's name, and puts them on clusters this repository pays for.
    # Which is what the label is for, and why it is the lane's boundary rather
    # than a formality. The lane reads the same label itself, so an unlabelled
    # pull request neither runs these nor is asked for them - see
    # .github/workflows/ci-on-push-trusted.yaml.
    names:
      # ci-on-push-trusted.yaml, the trusted lane
      - Kata Containers CI (trusted) / run-k8s-tests-on-aks / run-k8s-tests (cbl-mariner, clh-azure, normal)
      - Kata Containers CI (trusted) / run-k8s-tests-on-aks / run-k8s-tests (cbl-mariner, clh-azure, small, containerd)
      - Kata Containers CI (trusted) / run-k8s-tests-on-aks / run-k8s-tests (cbl-mariner, clh-azure, small, oci-distribution)
      - Kata Containers CI (trusted) / run-k8s-tests-on-aks / run-k8s-tests (cbl-mariner, clh-azure-runtime-rs, small)
      - Kata Containers CI (trusted) / run-k8s-tests-on-aks / run-k8s-tests (cbl-mariner, clh-azure-runtime-rs, normal)
    required-labels:
      - ok-to-test
  test-prt:
    # The suites that only the pull_request_target lane can run, each for one of
    # two reasons: they need a build on a self-hosted runner (s390x), or an image
    # that lane is still the only one to publish (the confidential guest image,
    # the NVIDIA ones). Moving a suite out of here is what shrinks that lane.
    #
    # It no longer covers the harness: both new lanes run the pull request's own
    # tests/, so a change there is exercised without this lane and ^tests/ above
    # says so. What still brings this set in is a change to a workflow file,
    # since the trusted lane's own YAML is always the default branch's and this
    # is the only lane that runs a pull request's.
    # TEMPORARY, sandbox only: the whole set is silenced, names and label alike,
    # so that a run here is judged by the two new lanes and nothing else. Every
    # suite left in it needs a self-hosted runner - s390x, a TEE machine or a
    # GPU - and the s390x jobs are commented out in ci.yaml besides. Restore the
    # lot together.
    names:
      # ci-on-push-prt.yaml (ci.yaml)
      # - Kata Containers CI / kata-containers-ci-on-push / run-cri-containerd-tests-s390x (latest, qemu) / run-cri-containerd-s390x (latest, qemu)
      # - Kata Containers CI / kata-containers-ci-on-push / run-k8s-tests-on-zvsi / run-k8s-tests (devmapper, qemu, kubeadm)
      # - Kata Containers CI / kata-containers-ci-on-push / run-k8s-tests-on-zvsi / run-k8s-tests (nydus, qemu-coco-dev, kubeadm)
