{{- /*
Staged install as a single Indexed Job (deploymentMode: job).

Instead of one Job per node, job mode emits ONE Indexed Job whose pods fan out
across the selected nodes - one pod per node (enforced by a hostname topology
spread), `completions` == number of selected nodes, and up to `job.parallelism`
pods running concurrently. Each pod runs the install pipeline as ordered
initContainers against its OWN host and exits:

  host-check -> artifacts -> cri   (initContainers, run sequentially)
  label                            (main container)

Each pod learns its node from the downward API (NODE_NAME = spec.nodeName, see
kata-deploy.commonEnv), so nothing is pinned via nodeName. Every host-touching
stage runs privileged with hostPID, because they shell into the host via nsenter
(host-check and cri restart/configure the runtime; artifacts sets up
snapshotters, e.g. nydus). Only the label stage is unprivileged (API only).

Why one Indexed Job and not one Job per node: Helm stores the whole rendered
release in a single ~1 MiB Secret and runs hook resources sequentially, so a
per-node fan-out hits a hard storage cap and serializes on large fleets. One
Indexed Job is a single object whose pods run in parallel.

This is a Helm post-install/post-upgrade hook with before-hook-creation delete
policy, so re-running `helm upgrade` re-creates and re-runs it (idempotent
stages skip already-installed nodes and pick up newly added ones).

Note: per-node coverage relies on completions == node count plus the hostname
topology spread. If a node is unschedulable, or an index keeps failing, that
node's pod may stay Pending; backoffLimitPerIndex isolates per-node failures.
*/ -}}
{{- if eq (.Values.deploymentMode | default "daemonset") "job" }}
{{- $root := . }}
{{- $base := .Chart.Name }}
{{- if .Values.env.multiInstallSuffix }}
{{- $base = printf "%s-%s" .Chart.Name .Values.env.multiInstallSuffix }}
{{- end }}
{{- $sa := include "kata-deploy.serviceAccountName" . }}
{{- $count := include "kata-deploy.jobNodeCount" . | int }}
{{- if gt $count 0 }}
{{- $parallelism := min (int $root.Values.job.parallelism) $count }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-install" $base | trunc 63 | trimSuffix "-" }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kata-deploy.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    kata-deploy/stage: install
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  completionMode: Indexed
  completions: {{ $count }}
  parallelism: {{ $parallelism }}
  backoffLimitPerIndex: {{ $root.Values.job.backoffLimit }}
  maxFailedIndexes: {{ $count }}
  ttlSecondsAfterFinished: {{ $root.Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kata-deploy.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        kata-deploy/stage: install
    spec:
{{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml . | nindent 8 }}
{{- end }}
      serviceAccountName: {{ $sa }}
      restartPolicy: Never
      hostPID: true
{{- with $root.Values.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- with $root.Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
{{- end }}
{{- include "kata-deploy.jobScheduling" (dict "root" $root "nodes" $root.Values.job.nodes "eq" ($root.Values.job.nodeSelector | default dict) "exprs" ($root.Values.job.nodeSelectorExpressions | default list) "stage" "install") | nindent 6 }}
      initContainers:
{{- include "kata-deploy.stageContainer" (dict "root" $root "name" "host-check" "action" "install-stage-host-check" "privileged" true "mountHost" true) | nindent 6 }}
{{- include "kata-deploy.stageContainer" (dict "root" $root "name" "artifacts" "action" "install-stage-artifacts" "privileged" true "mountHost" true) | nindent 6 }}
{{- include "kata-deploy.stageContainer" (dict "root" $root "name" "cri" "action" "install-stage-cri" "privileged" true "mountHost" true) | nindent 6 }}
      containers:
{{- include "kata-deploy.stageContainer" (dict "root" $root "name" "label" "action" "install-stage-label" "privileged" false "mountHost" false) | nindent 6 }}
      volumes:
{{- include "kata-deploy.commonVolumes" $root | nindent 6 }}
{{- end }}
{{- end }}
