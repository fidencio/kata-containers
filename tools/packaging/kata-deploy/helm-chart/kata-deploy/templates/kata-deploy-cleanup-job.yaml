{{- /*
Staged cleanup as a single Indexed Job (deploymentMode: job, pre-delete hook).

The mirror image of the install Job: ONE Indexed Job whose pods fan out across
the selected nodes - one pod per node (hostname topology spread), `completions`
== number of selected nodes, up to `job.parallelism` concurrent. Each pod runs
the install pipeline in reverse against its OWN host and exits:

  unlabel -> revert-cri   (initContainers, run sequentially)
  remove-artifacts        (main container)

Each pod learns its node from the downward API (NODE_NAME = spec.nodeName).

This is a Helm pre-delete hook: on `helm uninstall` it runs while the release's
kept ServiceAccount/RBAC still exist, undoes the host changes, and completes
before those are torn down. The post-delete rb-cleanup Job removes the RBAC
afterwards.

Node selection note: Helm renders and stores hook manifests at install/upgrade
time and replays them verbatim at uninstall (no re-templating), so both the
completion count and the scheduling selectors are frozen at the last
install/upgrade. By default they mirror the install selection (see
kata-deploy.cleanupNodeNames), so uninstall targets exactly the nodes install
targeted.

Ordering rationale (reverse of install):
  - unlabel first  : stop the scheduler from placing kata workloads here
                     (unprivileged, Kubernetes API only).
  - revert-cri next: remove CRI drop-ins and restart the runtime
                     (privileged, host nsenter; skipped when already absent).
  - remove-artifacts last: delete kata artifacts/config from the host
                     (privileged, mounts the host; skipped when already gone).

Each stage action is idempotent, so a re-run (or a node that was never fully
installed) is safe and cheap.
*/ -}}
{{- if eq (.Values.deploymentMode | default "daemonset") "job" }}
{{- $root := . }}
{{- $base := .Chart.Name }}
{{- if .Values.env.multiInstallSuffix }}
{{- $base = printf "%s-%s" .Chart.Name .Values.env.multiInstallSuffix }}
{{- end }}
{{- $sa := include "kata-deploy.serviceAccountName" . }}
{{- $count := include "kata-deploy.cleanupNodeCount" . | int }}
{{- if gt $count 0 }}
{{- $parallelism := min (int $root.Values.job.parallelism) $count }}
{{- /* Resolve the effective cleanup selection (mirror install unless overridden). */ -}}
{{- $cleanup := $root.Values.job.cleanup | default dict }}
{{- $cNodes := $cleanup.nodes | default list }}
{{- $cEq := $cleanup.nodeSelector | default dict }}
{{- $cExprs := $cleanup.nodeSelectorExpressions | default list }}
{{- if and (eq (len $cNodes) 0) (eq (len $cEq) 0) (eq (len $cExprs) 0) }}
{{- $cNodes = $root.Values.job.nodes }}
{{- $cEq = ($root.Values.job.nodeSelector | default dict) }}
{{- $cExprs = ($root.Values.job.nodeSelectorExpressions | default list) }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-cleanup" $base | trunc 63 | trimSuffix "-" }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kata-deploy.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    kata-deploy/stage: cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  completionMode: Indexed
  completions: {{ $count }}
  parallelism: {{ $parallelism }}
  backoffLimitPerIndex: {{ $root.Values.job.backoffLimit }}
  maxFailedIndexes: {{ $count }}
  ttlSecondsAfterFinished: {{ $root.Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kata-deploy.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        kata-deploy/stage: cleanup
    spec:
{{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml . | nindent 8 }}
{{- end }}
      serviceAccountName: {{ $sa }}
      restartPolicy: Never
      hostPID: true
{{- with $root.Values.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- with $root.Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
{{- end }}
{{- include "kata-deploy.jobScheduling" (dict "root" $root "nodes" $cNodes "eq" $cEq "exprs" $cExprs "stage" "cleanup") | nindent 6 }}
      initContainers:
{{- include "kata-deploy.stageContainer" (dict "root" $root "name" "unlabel" "action" "cleanup-stage-unlabel" "privileged" false "mountHost" false) | nindent 6 }}
{{- include "kata-deploy.stageContainer" (dict "root" $root "name" "revert-cri" "action" "cleanup-stage-revert-cri" "privileged" true "mountHost" true) | nindent 6 }}
      containers:
{{- include "kata-deploy.stageContainer" (dict "root" $root "name" "remove-artifacts" "action" "cleanup-stage-remove-artifacts" "privileged" true "mountHost" true) | nindent 6 }}
      volumes:
{{- include "kata-deploy.commonVolumes" $root | nindent 6 }}
{{- end }}
{{- end }}
