# Example values file to enable NVIDIA GPU shims
# This includes all NVIDIA GPU-enabled shims (Go and runtime-rs variants)
#
# Usage:
#   helm install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version VERSION \
#     -f try-kata-nvidia-gpu.values.yaml

debug: false

snapshotter:
  setup: ["nydus"]

# Enable NVIDIA GPU shims
# Disable all shims at once, then enable only the ones we need
shims:
  disableAll: true

  # Enable NVIDIA GPU shims
  qemu-nvidia-gpu:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  qemu-nvidia-gpu-snp:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-nvidia-gpu-tdx:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  # Enable NVIDIA GPU runtime-rs shims
  qemu-nvidia-gpu-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  qemu-nvidia-gpu-snp-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-nvidia-gpu-tdx-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

# Default shim per architecture (prefer NVIDIA GPU shims)
defaultShim:
  amd64: qemu-nvidia-gpu  # Can be changed to qemu-nvidia-gpu-snp or qemu-nvidia-gpu-tdx if preferred
  arm64: qemu-nvidia-gpu

runtimeClasses:
  enabled: true
  createDefault: false
  defaultName: "kata"

